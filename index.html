le:"Calls and SMS",esTitle:"Llamadas y SMS",enBody:"If you affirmatively select the call/SMS option on a RouteX Freight form, you agree that RouteX Freight may call or text you at the number provided about your quote, shipment planning, pickup and delivery coordination, shipment status, ETA updates, document requests and other operational freight communications. Message frequency may vary and message/data rates may apply. Reply STOP to opt out and HELP for assistance. Consent is not a condition of requesting a quote or receiving services.",esBody:"Si seleccionas afirmativamente la opción de llamadas/SMS en un formulario de RouteX Freight, aceptas que RouteX Freight te llame o envíe mensajes al número proporcionado sobre tu cotización, planeación de envío, coordinación de recolección y entrega, estado del envío, actualizaciones ETA, solicitudes de documentos y otras comunicaciones operativas de carga. La frecuencia puede variar y pueden aplicarse tarifas de mensajes/datos. Responde STOP para cancelar y HELP para recibir ayuda. El consentimiento no es condición para solicitar una cotización ni recibir servicios."},{enTitle:"Email updates",esTitle:"Actualizaciones por email",enBody:"If you select the email-updates option, we may send service and operational updates to the email address provided. You may opt out of non-essential email updates using the instructions in the message.",esBody:"Si seleccionas la opción de actualizaciones por email, podemos enviar actualizaciones de servicio y operaciones al email proporcionado. Puedes cancelar actualizaciones de email no esenciales siguiendo las instrucciones del mensaje."},{enTitle:"Sharing and retention",esTitle:"Compartir y retención",enBody:"We do not sell personal information. We may share information with service providers that support hosting, form processing, CRM, communications and messaging, only as needed to provide those services. Mobile opt-in data and consent are not shared with third parties or affiliates for marketing or promotional purposes. We retain information for as long as reasonably needed for the stated purposes and applicable obligations.",esBody:"No vendemos información personal. Podemos compartir información con proveedores que apoyan hosting, procesamiento de formularios, CRM, comunicaciones y mensajería, solo en la medida necesaria para prestar esos servicios. Los datos de opt-in móvil y el consentimiento no se comparten con terceros o afiliados para fines de marketing o promoción. Conservamos la información el tiempo razonablemente necesario para los fines descritos y obligaciones aplicables."},{enTitle:"Your choices",esTitle:"Tus opciones",enBody:"You may opt out of SMS by replying STOP, request HELP by replying HELP, and request access, correction or deletion of your personal information by contacting RouteX Freight. Depending on where you reside, you may have additional privacy rights.",esBody:"Puedes cancelar SMS respondiendo STOP, solicitar ayuda respondiendo HELP y pedir acceso, corrección o eliminación de tu información personal contactando a RouteX Freight. Dependiendo de dónde residas, puedes tener derechos de privacidad adicionales."}],Py=[{enTitle:"Acceptance of terms",esTitle:"Aceptación de términos",enBody:"These Terms & Conditions govern your use of the RouteX Freight website, including quote, dispatch-intake and tracking forms. By accessing the website or submitting a form, you agree to these Terms and the RouteX Freight Privacy Policy.",esBody:"Estos Términos y Condiciones regulan tu uso del sitio web de RouteX Freight, incluidos formularios de cotización, Operations Desk y tracking. Al acceder al sitio o enviar un formulario, aceptas estos Términos y la Política de Privacidad de RouteX Freight."},{enTitle:"Site use and quotes",esTitle:"Uso del sitio y cotizaciones",enBody:"The website provides information about RouteX Freight services and allows you to request quotes and contact RouteX Freight. Please provide accurate information and use the site only for lawful purposes. A quote request or informational response does not create a binding rate confirmation or contract of carriage; freight services are provided under separately agreed terms and transportation documents.",esBody:"El sitio proporciona información sobre los servicios de RouteX Freight y permite solicitar cotizaciones y contactar a RouteX Freight. Proporciona información precisa y usa el sitio solo para fines legales. Una solicitud de cotización o respuesta informativa no crea una confirmación de tarifa vinculante ni un contrato de transporte; los servicios de carga se proporcionan bajo términos y documentos de transporte acordados por separado."},{enTitle:"Calls and text-message terms",esTitle:"Términos de llamadas y mensajes",enBody:"By selecting the call/SMS consent option or otherwise providing prior express consent, you agree to receive RouteX Freight calls or text messages at the number provided regarding your quote, shipment planning, pickup or delivery coordination, shipment status, ETA updates, document requests and other operational communications. Message frequency may vary. Message and data rates may apply. Reply STOP to opt out or HELP for assistance. Consent is not a condition of any purchase or service. Mobile carriers are not liable for delayed or undelivered messages.",esBody:"Al seleccionar la opción de consentimiento de llamadas/SMS o proporcionar consentimiento expreso previo, aceptas recibir llamadas o mensajes de texto de RouteX Freight al número proporcionado sobre tu cotización, planeación de envío, coordinación de recolección o entrega, estado del envío, actualizaciones ETA, solicitudes de documentos y otras comunicaciones operativas. La frecuencia puede variar. Pueden aplicarse tarifas de mensajes y datos. Responde STOP para cancelar o HELP para recibir ayuda. El consentimiento no es condición de compra ni servicio. Los carriers móviles no son responsables por mensajes retrasados o no entregados."},{enTitle:"Inte
